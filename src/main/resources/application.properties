quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
# --- Common Configuration ---
quarkus.datasource.jdbc.max-size=16
quarkus.hibernate-orm.database.generation=validate
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/config/changeLog.xml
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true

# --- Dev Profile (Default/Local) ---
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/gym_db
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=*
%dev.quarkus.swagger-ui.always-include=true

# --- Staging Profile ---
%staging.quarkus.datasource.jdbc.url=jdbc:postgresql://${STAGING_DB_HOST}:5432/gym_db
%staging.quarkus.datasource.username=${STAGING_DB_USER}
%staging.quarkus.datasource.password=${STAGING_DB_PASSWORD}
%staging.quarkus.http.cors.enabled=true
%staging.quarkus.http.cors.origins=${STAGING_CORS_ORIGIN}
%staging.quarkus.swagger-ui.always-include=true

# --- Prod Profile ---
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${PROD_DB_HOST}:5432/gym_db
%prod.quarkus.datasource.username=${PROD_DB_USER}
%prod.quarkus.datasource.password=${PROD_DB_PASSWORD}
%prod.quarkus.http.cors.enabled=true
%prod.quarkus.http.cors.origins=${PROD_CORS_ORIGIN}
%prod.quarkus.log.level=INFO

quarkus.log.category."org.project".level=DEBUG

# --- Monitoring & Observability ---
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.smallrye-health.root-path=/q/health
