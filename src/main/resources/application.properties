# --- Security & JWT ---
mp.jwt.verify.issuer=https://gym-project.com
# Symmetric key (HS256) for both signing and verification
# Must be at least 32 characters
smallrye.jwt.sign.key.secret=supersecretkey-mustbe-atleast-32characters-long
smallrye.jwt.verify.key.secret=supersecretkey-mustbe-atleast-32characters-long
mp.jwt.verify.publickey.algorithm=HS256

